name: Native Linux x64

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/workspace-index/**'
      - 'packages/workspace-local/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native-linux.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/workspace-index/**'
      - 'packages/workspace-local/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native-linux.yml'

jobs:
  native-linux-x64:
    name: Linux x64 · Electron native smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      FOLIO_NATIVE_TARGET: linux-x64
      FOLIO_GIT_COMMIT: ${{ github.sha }}
      FOLIO_BUILD_CHANNEL: development
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: native-identity
        name: Read native identity
        shell: bash
        run: |
          echo "electron=$(node -p \"require('./apps/desktop/node_modules/electron/package.json').version\")" >> "$GITHUB_OUTPUT"
          echo "sqlite=$(node -p \"require('./apps/desktop/node_modules/better-sqlite3/package.json').version\")" >> "$GITHUB_OUTPUT"
          echo "abi=$(ELECTRON_RUN_AS_NODE=1 ./apps/desktop/node_modules/.bin/electron -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: apps/desktop/.native-cache
          key: folio-native-linux-x64-electron-${{ steps.native-identity.outputs.electron }}-sqlite-${{ steps.native-identity.outputs.sqlite }}-abi-${{ steps.native-identity.outputs.abi }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Verify source and assemble Electron runtime
        run: pnpm check:release

      - name: Run Electron native smoke
        run: xvfb-run -a pnpm --filter @abnt/desktop smoke:native

      - name: Package Linux application
        run: pnpm --filter @abnt/desktop package:linux

      - name: Run packaged application smoke
        run: xvfb-run -a pnpm --filter @abnt/desktop smoke:package

      - name: Build Debian installer
        run: pnpm --filter @abnt/desktop installer:linux

      - name: Run installed Debian artifact smoke
        run: xvfb-run -a pnpm --filter @abnt/desktop smoke:installer

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-native-linux-x64-electron-${{ steps.native-identity.outputs.electron }}-sqlite-${{ steps.native-identity.outputs.sqlite }}-abi-${{ steps.native-identity.outputs.abi }}
          path: |
            apps/desktop/dist/workspace/native-addon.json
            apps/desktop/dist/build-info.json
            apps/desktop/dist/workspace/node_modules/better-sqlite3/build/Release/better_sqlite3.node
            apps/desktop/release/linux-unpacked
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
